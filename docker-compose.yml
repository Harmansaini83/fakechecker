services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fc_user
      POSTGRES_PASSWORD: fc_pass
      POSTGRES_DB: fakechecker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata: